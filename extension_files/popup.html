<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 14px;
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f8fafc;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #0f172a;
    }
    label {
      font-size: 12px;
      color: #475569;
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
    }
    button {
      width: 100%;
      background: #25D366;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #1eb956;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      text-align: center;
      color: #15803d;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>
  <h3>Wubachat Account</h3>
  <label for="userPhone">Sender Mobile Number:</label>
  <input type="text" id="userPhone" placeholder="Enter 10-digit mobile" maxlength="12">
  <button id="saveBtn">Save Number</button>
  <div id="status">Saved Successfully!</div>

  <script src="popup.js"></script>
</body>
</html>
